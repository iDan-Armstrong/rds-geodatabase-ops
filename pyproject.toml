[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rdsops"
version = "0.1.0"
description = "Operations tooling for an ArcGIS enterprise geodatabase on Amazon RDS for PostgreSQL"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Armstrong" }]
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[rds]>=5.0", "ruff>=0.6"]

[project.scripts]
rdsops = "rdsops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
