name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (moto; no AWS account, no credentials)
        run: pytest

  postgis:
    # The SQL checks run against a real server. pg_stat_statements has to be preloaded,
    # which service containers cannot pass as a startup flag, so the job sets it with
    # ALTER SYSTEM and restarts the container before the tests run.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["postgis/postgis:16-3.4", "postgis/postgis:17-3.5"]
    services:
      postgis:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RDSOPS_TEST_DSN: host=localhost user=postgres password=ci dbname=postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preload pg_stat_statements
        run: |
          psql "$RDSOPS_TEST_DSN" -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgis.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -U postgres && break; sleep 2; done
          psql "$RDSOPS_TEST_DSN" -c "SHOW shared_preload_libraries"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests (seeded problems in a real PostGIS)
        run: pytest -m pg -rs
      - name: rdsops against the CI database
        env:
          RDSOPS_DSN: ${{ env.RDSOPS_TEST_DSN }}
        run: |
          rdsops health || test $? -eq 1
          rdsops maintenance || test $? -eq 1

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - terraform/modules/egdb-postgres
          - terraform/examples/minimal
          - terraform/examples/govcloud
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          pip install checkov
          # Production-shaped example: only the inline, justified skips in the module apply.
          checkov -d terraform/examples/govcloud --framework terraform --compact --quiet
          # Lab example turns off Multi-AZ, deletion protection and Enhanced Monitoring
          # on purpose to keep a drill cheap and disposable. Those three are skipped here only.
          checkov -d terraform/examples/minimal --framework terraform --compact --quiet \
            --skip-check CKV_AWS_157,CKV_AWS_293,CKV_AWS_118
